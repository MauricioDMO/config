# ─────────────────────────────────────────────
# Fuente
# ─────────────────────────────────────────────

font_family Cascadia Code
font_size 10


# ─────────────────────────────────────────────
# Terminal
# ─────────────────────────────────────────────

term xterm-kitty
allow_remote_control socket-only
shell_integration enabled


# ─────────────────────────────────────────────
# Colores
# ─────────────────────────────────────────────

foreground #ffffff
background #1e1e1e

cursor #2e6f40
cursor_text_color #1e1e1e

selection_foreground #ffffff
selection_background #2e6f40


# ─────────────────────────────────────────────
# Apariencia
# ─────────────────────────────────────────────

background_opacity 0.92

hide_window_decorations yes
window_padding_width 10


# ─────────────────────────────────────────────
# Historial y desplazamiento
# ─────────────────────────────────────────────

scrollback_lines 10000
scrollback_pager_history_size 10

scrollbar scrolled
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_handle_color #2e6f40

wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.5
pixel_scroll yes


# ─────────────────────────────────────────────
# Selección y portapapeles
# ─────────────────────────────────────────────

strip_trailing_spaces smart

# Descomenta para copiar automáticamente al seleccionar
# copy_on_select clipboard

map ctrl+c copy_and_clear_or_interrupt

map ctrl+v paste_from_clipboard
map ctrl+shift+v paste_from_clipboard

# Envía el Ctrl+V original a Vim, Neovim u otra aplicación
map ctrl+alt+v send_key ctrl+v


# ─────────────────────────────────────────────
# Búsqueda e historial
# ─────────────────────────────────────────────

# Buscar directamente dentro del historial
map ctrl+shift+f search_scrollback

# Abrir el historial completo
map ctrl+shift+h show_scrollback

# Mostrar únicamente la salida del último comando
map ctrl+shift+g show_last_command_output


# ─────────────────────────────────────────────
# Tamaño de fuente
# ─────────────────────────────────────────────

# Cambiar solo la ventana actual
map ctrl+equal change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
map ctrl+0 change_font_size current 0

# Cambiar todas las ventanas
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+right_paren change_font_size all 0


# ─────────────────────────────────────────────
# Movimiento y edición
# ─────────────────────────────────────────────

map ctrl+backspace send_text all \x1b\x7f
map ctrl+delete send_text all \x1bd

map ctrl+left send_text all \x1bb
map ctrl+right send_text all \x1bf